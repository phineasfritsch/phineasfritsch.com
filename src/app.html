<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<meta
			name="description"
			content="Phineas Fritsch — financial actuarial mathematics at UCLA. I build tools for problems I actually have."
		/>
		<!-- Fonts are self-hosted, not fetched from a font CDN. A cross-origin
		     stylesheet is render-blocking and DOMContentLoaded waits on it: measured
		     here at roughly eight seconds per page before any script ran. Same origin,
		     preloaded, and swap so text paints immediately. -->
		<link
			rel="preload"
			href="/fonts/ibm-plex-sans-var.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/ibm-plex-mono-400.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
